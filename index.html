<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundFinder - Free Full Song Player</title>
<style>
  :root {
    --bg: #0a0a0f; --panel: #13131a; --card: #1a1a24; --accent: #1db954;
    --accent-hover: #1ed760; --text: #eaeaf2; --muted: #7a7a94; --border: #2a2a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: 0 0 140px;
  }
  header {
    background: linear-gradient(180deg, #12121e 0%, var(--bg) 100%);
    padding: 50px 20px 30px; text-align: center;
  }
  h1 {
    font-size: 2.4rem; font-weight: 800; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), #6ee7b7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
  .search-wrap { max-width: 600px; margin: 0 auto 16px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 14px 120px 14px 46px; border-radius: 50px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,185,84,0.12); }
  .search-wrap .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  .search-wrap button {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    padding: 9px 20px; border: none; border-radius: 50px; background: var(--accent);
    color: #04140a; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .search-wrap button:hover { background: var(--accent-hover); }
  .search-wrap button:disabled { opacity: 0.5; cursor: not-allowed; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 600px; margin: 0 auto; }
  .pills span { color: var(--muted); font-size: 12px; align-self: center; margin-right: 2px; }
  .pill {
    padding: 6px 14px; border-radius: 50px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { background: var(--card); color: var(--text); border-color: var(--accent); }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  #status { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; min-height: 20px; }
  .section { margin-bottom: 32px; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .section-icon {
    width: 38px; height: 38px; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .section-title { font-size: 1.25rem; font-weight: 700; }
  .section-sub { color: var(--muted); font-size: 0.75rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 10px; cursor: pointer;
    transition: transform 0.15s, background 0.15s; position: relative;
  }
  .card:hover { transform: translateY(-3px); background: #22222e; }
  .card.playing { outline: 2px solid var(--accent); background: rgba(29,185,84,0.06); }
  .card img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;
    background: #22222e; display: block;
  }
  .card .play-btn {
    position: absolute; bottom: 70px; right: 18px; width: 40px; height: 40px;
    border-radius: 50%; background: var(--accent); display: flex;
    align-items: center; justify-content: center; font-size: 16px; color: #04140a;
    opacity: 0; transform: translateY(6px); transition: all 0.2s;
    box-shadow: 0 6px 14px rgba(0,0,0,0.5); border: none; cursor: pointer;
  }
  .card:hover .play-btn { opacity: 1; transform: translateY(0); }
  .card .title {
    font-weight: 600; margin-top: 8px; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.playing .title { color: var(--accent); }
  .card .artist {
    color: var(--muted); font-size: 11px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .tag {
    display: inline-block; margin-top: 5px; padding: 2px 7px;
    background: rgba(255,255,255,0.05); border-radius: 8px;
    font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .track {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; transition: background 0.15s;
  }
  .track:hover { background: rgba(255,255,255,0.04); }
  .track.playing { background: rgba(29,185,84,0.07); }
  .track-num { width: 26px; text-align: center; color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .track.playing .track-num { color: var(--accent); }
  .track img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: #22222e; flex-shrink: 0; }
  .track-info { flex: 1; min-width: 0; }
  .track-title { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track.playing .track-title { color: var(--accent); }
  .track-artist { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-tag {
    padding: 3px 8px; background: rgba(255,255,255,0.04); border-radius: 8px;
    font-size: 10px; color: var(--muted); flex-shrink: 0; text-transform: uppercase;
  }
  .track-dur { color: var(--muted); font-size: 11px; width: 42px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(19,19,26,0.97);
    border-top: 1px solid var(--border); padding: 12px 20px;
    display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 16px; align-items: center;
    backdrop-filter: blur(24px); z-index: 100;
  }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #22222e; flex-shrink: 0; }
  .now .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .a { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .btns { display: flex; gap: 8px; align-items: center; }
  .btns button {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; padding: 6px 10px; border-radius: 50%; transition: color 0.15s;
  }
  .btns button:hover { color: var(--text); }
  .btns .big {
    width: 40px; height: 40px; background: white; color: #000; border-radius: 50%;
    font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btns .big:hover { transform: scale(1.06); }
  .progress { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 4px;
    border-radius: 2px; background: #333; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: white; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: white;
    cursor: pointer; border: none;
  }
  .vol { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .vol input { width: 90px; }
  .loading { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .genre-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px; max-width: 700px; margin: 24px auto 0;
  }
  .genre-card {
    padding: 14px 10px; border-radius: 10px; text-align: center; cursor: pointer;
    font-weight: 700; font-size: 13px; color: white; border: none;
    transition: transform 0.15s, filter 0.15s;
  }
  .genre-card:hover { transform: scale(1.05); filter: brightness(1.15); }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
    background: rgba(29,185,84,0.1); border: 1px solid rgba(29,185,84,0.2);
    border-radius: 50px; font-size: 11px; color: var(--accent); margin-bottom: 16px;
  }
  @media (max-width: 700px) {
    .player { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
    .vol { justify-content: center; }
    .track-tag { display: none; }
    h1 { font-size: 1.7rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <h1>🎵 SoundFinder</h1>
  <p class="subtitle">Free full-length music — no API key needed</p>
  <div class="badge">🌐 Powered by Internet Archive</div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="query" placeholder="Search for music..." autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>
  <div class="pills">
    <span>Try:</span>
    <button class="pill" data-q="rock music">Rock</button>
    <button class="pill" data-q="jazz music">Jazz</button>
    <button class="pill" data-q="electronic music">Electronic</button>
    <button class="pill" data-q="classical music">Classical</button>
    <button class="pill" data-q="ambient music">Ambient</button>
    <button class="pill" data-q="hip hop music">Hip Hop</button>
    <button class="pill" data-q="blues music">Blues</button>
    <button class="pill" data-q="folk music">Folk</button>
    <button class="pill" data-q="punk music">Punk</button>
    <button class="pill" data-q="metal music">Metal</button>
  </div>
</header>

<div class="container">
  <div id="status"></div>
  <div id="content">
    <div class="empty">
      <div class="icon">🎧</div>
      <p>Search for music or pick a genre below</p>
    </div>
    <div class="genre-grid" id="genreGrid"></div>
  </div>
</div>

<div class="player" id="player" style="display:none">
  <div class="now">
    <img id="nowArt" src="" alt="">
    <div style="min-width:0">
      <div class="t" id="nowTitle">Nothing playing</div>
      <div class="a" id="nowArtist"></div>
    </div>
  </div>
  <div class="center">
    <div class="btns">
      <button id="prevBtn" title="Previous">⏮</button>
      <button id="playBtn" class="big" title="Play/Pause">▶</button>
      <button id="nextBtn" title="Next">⏭</button>
    </div>
    <div class="progress">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="dur">0:00</span>
    </div>
  </div>
  <div class="vol">
    🔊 <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');

  let tracks = [];
  let recommendations = [];
  let current = -1;
  let currentList = 'tracks';
  let lastQuery = '';

  const AUDIO_EXT = /\.(mp3|ogg|opus|flac|m4a|aac)(\?|$)/i;

  // Genre cards
  const genres = [
    { name: 'Rock', q: 'rock music', color: 'linear-gradient(135deg,#e74c3c,#c0392b)' },
    { name: 'Jazz', q: 'jazz music', color: 'linear-gradient(135deg,#f39c12,#e67e22)' },
    { name: 'Electronic', q: 'electronic music', color: 'linear-gradient(135deg,#00bcd4,#0097a7)' },
    { name: 'Classical', q: 'classical music', color: 'linear-gradient(135deg,#7e57c2,#5e35b1)' },
    { name: 'Ambient', q: 'ambient music', color: 'linear-gradient(135deg,#26a69a,#00897b)' },
    { name: 'Hip Hop', q: 'hip hop music', color: 'linear-gradient(135deg,#ab47bc,#8e24aa)' },
    { name: 'Blues', q: 'blues music', color: 'linear-gradient(135deg,#42a5f5,#1e88e5)' },
    { name: 'Folk', q: 'folk music', color: 'linear-gradient(135deg,#8d6e63,#6d4c41)' },
    { name: 'Punk', q: 'punk music', color: 'linear-gradient(135deg,#ef5350,#d32f2f)' },
    { name: 'Metal', q: 'metal music', color: 'linear-gradient(135deg,#546e7a,#37474f)' },
    { name: 'Country', q: 'country music', color: 'linear-gradient(135deg,#ffa726,#fb8c00)' },
    { name: 'Reggae', q: 'reggae music', color: 'linear-gradient(135deg,#66bb6a,#43a047)' },
  ];

  $('genreGrid').innerHTML = genres.map(g =>
    `<button class="genre-card" style="background:${g.color}" data-q="${g.q}">${g.name}</button>`
  ).join('');

  document.querySelectorAll('.genre-card').forEach(el => {
    el.addEventListener('click', () => { $('query').value = el.dataset.q; doSearch(); });
  });

  // Helpers
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const fmt = s => {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  };

  const setStatus = msg => $('status').textContent = msg;

  // Archive.org API
  async function searchArchive(query) {
    const q = encodeURIComponent(`${query} AND mediatype:audio`);
    const url = `https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=description&fl[]=downloads&fl[]=year&rows=30&output=json&sort[]=downloads+desc`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Search failed. Please try again.');
    const data = await res.json();
    if (!data.response || !data.response.docs || data.response.docs.length === 0) return [];
    return data.response.docs;
  }

  async function getAudioFiles(identifier) {
    const url = `https://archive.org/metadata/${encodeURIComponent(identifier)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.files) return null;

    const audioFiles = data.files.filter(f => AUDIO_EXT.test(f.name || '') && f.source !== 'metadata');
    const imageFiles = data.files.filter(f => /\.(jpg|jpeg|png|gif)(\?|$)/i.test(f.name || ''));

    // Pick the best audio file (prefer mp3, then others)
    let bestAudio = audioFiles.find(f => /\.mp3(\?|$)/i.test(f.name)) || audioFiles[0];
    if (!bestAudio) return null;

    // Pick cover art
    let coverArt = imageFiles.find(f => /cover|front|artwork|album/i.test(f.name)) || imageFiles[0];

    const audioUrl = `https://archive.org/download/${encodeURIComponent(identifier)}/${encodeURIComponent(bestAudio.name)}`;
    const artUrl = coverArt
      ? `https://archive.org/download/${encodeURIComponent(identifier)}/${encodeURIComponent(coverArt.name)}`
      : `https://archive.org/services/img/${encodeURIComponent(identifier)}`;

    return {
      audioUrl,
      artUrl,
      duration: bestAudio.length ? parseFloat(bestAudio.length) : 0,
      size: bestAudio.size ? parseInt(bestAudio.size) : 0,
    };
  }

  async function doSearch() {
    const q = $('query').value.trim();
    if (!q) return;
    lastQuery = q;
    setStatus('Searching...');
    $('content').innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;color:var(--muted)">Finding music...</p></div>';
    $('searchBtn').disabled = true;

    try {
      const docs = await searchArchive(q);
      if (docs.length === 0) {
        $('content').innerHTML = '<div class="empty"><div class="icon">🔍</div><p>No results found. Try a different search.</p></div>';
        setStatus('');
        tracks = [];
        recommendations = [];
        $('searchBtn').disabled = false;
        return;
      }

      setStatus(`Found ${docs.length} albums. Loading audio files...`);

      // Fetch audio files for each result in parallel (batched)
      const batchSize = 6;
      const results = [];

      for (let i = 0; i < docs.length; i += batchSize) {
        const batch = docs.slice(i, i + batchSize);
        const batchResults = await Promise.allSettled(
          batch.map(async doc => {
            const files = await getAudioFiles(doc.identifier);
            if (!files) return null;
            return {
              id: doc.identifier,
              title: doc.title || doc.identifier,
              artist: Array.isArray(doc.creator) ? doc.creator.join(', ') : (doc.creator || 'Unknown Artist'),
              album: doc.title || '',
              art: files.artUrl,
              src: files.audioUrl,
              duration: files.duration,
              year: doc.year || '',
              fileName: files.audioUrl.split('/').pop(),
            };
          })
        );
        for (const r of batchResults) {
          if (r.status === 'fulfilled' && r.value) results.push(r.value);
        }
        setStatus(`Loading... ${Math.min(i + batchSize, docs.length)}/${docs.length}`);
      }

      tracks = results;

      if (tracks.length === 0) {
        $('content').innerHTML = '<div class="empty"><div class="icon">🎵</div><p>No playable audio found. Try a different search.</p></div>';
        setStatus('');
        $('searchBtn').disabled = false;
        return;
      }

      // Generate recommendations
      recommendations = getRecommendations(tracks.slice(0, 5), tracks, 8);
      renderAll();
      setStatus(`${tracks.length} tracks loaded`);
    } catch (e) {
      $('content').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
      setStatus('');
      tracks = [];
      recommendations = [];
    }
    $('searchBtn').disabled = false;
  }

  function getRecommendations(seeds, all, count) {
    if (seeds.length === 0) return [];
    const seedIds = new Set(seeds.map(t => t.id));
    const available = all.filter(t => !seedIds.has(t.id));
    if (available.length === 0) return [...seeds].sort(() => Math.random() - 0.5).slice(0, count);
    const scored = available.map(t => ({ track: t, score: Math.random() }));
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, Math.min(count, scored.length)).map(s => s.track);
  }

  function renderAll() {
    let html = '';

    if (recommendations.length > 0) {
      html += `
        <div class="section">
          <div class="section-head">
            <div class="section-icon" style="background:linear-gradient(135deg,var(--accent),#169c46)">✨</div>
            <div>
              <div class="section-title">Recommended</div>
              <div class="section-sub">Based on "${esc(lastQuery)}"</div>
            </div>
          </div>
          <div class="grid">
            ${recommendations.map((t, i) => `
              <div class="card ${currentList==='recs'&&current===i?'playing':''}" data-list="recs" data-i="${i}">
                <img src="${esc(t.art)}" alt="" loading="lazy" onerror="this.src='https://archive.org/services/img/${esc(t.id)}'">
                <button class="play-btn">▶</button>
                <div class="title">${esc(t.title)}</div>
                <div class="artist">${esc(t.artist)}</div>
                ${t.year ? `<div class="tag">${esc(t.year)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    html += `
      <div class="section">
        <div class="section-head">
          <div class="section-icon" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">🔍</div>
          <div>
            <div class="section-title">All Results</div>
            <div class="section-sub">${tracks.length} tracks for "${esc(lastQuery)}"</div>
          </div>
        </div>
        <div class="list">
          ${tracks.map((t, i) => `
            <div class="track ${currentList==='tracks'&&current===i?'playing':''}" data-list="tracks" data-i="${i}">
              <div class="track-num">${currentList==='tracks'&&current===i?'🔊':(i+1)}</div>
              <img src="${esc(t.art)}" alt="" loading="lazy" onerror="this.src='https://archive.org/services/img/${esc(t.id)}'">
              <div class="track-info">
                <div class="track-title">${esc(t.title)}</div>
                <div class="track-artist">${esc(t.artist)}</div>
              </div>
              <div class="track-tag">${esc(t.fileName || 'audio')}</div>
              <div class="track-dur">${t.duration ? fmt(t.duration) : '—'}</div>
            </div>
          `).join('')}
        </div>
      </div>`;

    $('content').innerHTML = html;

    document.querySelectorAll('.card, .track').forEach(el => {
      el.addEventListener('click', () => playFromList(el.dataset.list, +el.dataset.i));
    });
  }

  function getList(name) { return name === 'recs' ? recommendations : tracks; }

  function playFromList(listName, index) {
    const list = getList(listName);
    if (index < 0 || index >= list.length) return;
    currentList = listName;
    current = index;
    const t = list[index];
    audio.src = t.src;
    audio.play().catch(() => setStatus('Playback failed. Trying next...'));
    $('nowTitle').textContent = t.title;
    $('nowArtist').textContent = t.artist;
    $('nowArt').src = t.art;
    $('nowArt').onerror = function() { this.src = `https://archive.org/services/img/${t.id}`; };
    $('player').style.display = 'grid';
    renderAll();
  }

  const togglePlay = () => {
    if (current < 0 && tracks.length) return playFromList('tracks', 0);
    audio.paused ? audio.play() : audio.pause();
  };

  $('playBtn').onclick = togglePlay;
  $('nextBtn').onclick = () => {
    const list = getList(currentList);
    if (list.length === 0) return;
    playFromList(currentList, (current + 1) % list.length);
  };
  $('prevBtn').onclick = () => {
    const list = getList(currentList);
    if (list.length === 0) return;
    playFromList(currentList, current <= 0 ? list.length - 1 : current - 1);
  };

  audio.addEventListener('play', () => $('playBtn').textContent = '⏸');
  audio.addEventListener('pause', () => $('playBtn').textContent = '▶');
  audio.addEventListener('ended', () => $('nextBtn').click());
  audio.addEventListener('loadedmetadata', () => $('dur').textContent = fmt(audio.duration));
  audio.addEventListener('timeupdate', () => {
    $('cur').textContent = fmt(audio.currentTime);
    if (audio.duration) $('seek').value = (audio.currentTime / audio.duration) * 100;
  });
  audio.addEventListener('error', () => {
    setStatus('⚠️ Track failed to load. Skipping...');
    setTimeout(() => $('nextBtn').click(), 1200);
  });

  $('seek').addEventListener('input', e => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });
  $('vol').addEventListener('input', e => audio.volume = e.target.value);
  audio.volume = 0.8;

  $('searchBtn').onclick = doSearch;
  $('query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  document.querySelectorAll('.pill').forEach(el => {
    el.addEventListener('click', () => { $('query').value = el.dataset.q; doSearch(); });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight' && e.shiftKey) $('nextBtn').click();
    if (e.code === 'ArrowLeft' && e.shiftKey) $('prevBtn').click();
  });
})();
</script>
</body>
</html>
