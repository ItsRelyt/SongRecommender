<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundFinder - Full Song Player</title>
<style>
  :root {
    --bg: #0f0f14; --panel: #181822; --card: #1f1f2c; --accent: #1db954;
    --accent-hover: #1ed760; --text: #eaeaf2; --muted: #8b8ba3; --border: #2c2c3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: 20px 20px 140px;
  }
  header { max-width: 900px; margin: 0 auto 24px; }
  h1 {
    font-size: 2rem; font-weight: 800; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  input[type=text], input[type=password] {
    flex: 1; min-width: 200px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 15px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    padding: 12px 18px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #04140a; font-weight: 600; font-size: 14px;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .quick-picks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .quick-picks span { color: var(--muted); font-size: 13px; align-self: center; margin-right: 4px; }
  .pill {
    padding: 7px 14px; border-radius: 50px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { background: #26263a; color: var(--text); }
  .notice {
    font-size: 13px; color: var(--muted); background: var(--panel);
    border: 1px solid rgba(29,185,84,0.15); border-radius: 10px; padding: 12px 16px;
    margin-bottom: 20px;
  }
  .notice a { color: var(--accent); text-decoration: none; }
  .notice a:hover { text-decoration: underline; }
  #status { color: var(--muted); font-size: 14px; margin-bottom: 14px; min-height: 18px; }
  .section { margin-bottom: 32px; }
  .section-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .section-icon {
    width: 40px; height: 40px; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .section-title { font-size: 1.3rem; font-weight: 700; }
  .section-sub { color: var(--muted); font-size: 0.8rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 12px; cursor: pointer;
    transition: transform .15s, background .15s; position: relative;
  }
  .card:hover { transform: translateY(-3px); background: #26263a; }
  .card.playing { outline: 2px solid var(--accent); }
  .card img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px;
    background: #2a2a3a; display: block;
  }
  .card .play-overlay {
    position: absolute; bottom: 76px; right: 20px; width: 44px; height: 44px;
    border-radius: 50%; background: var(--accent); display: flex;
    align-items: center; justify-content: center; font-size: 18px; color: #04140a;
    opacity: 0; transform: translateY(6px); transition: all 0.2s;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .card:hover .play-overlay { opacity: 1; transform: translateY(0); }
  .card .title {
    font-weight: 600; margin-top: 10px; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.playing .title { color: var(--accent); }
  .card .artist {
    color: var(--muted); font-size: 12px; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .genre-tag {
    display: inline-block; margin-top: 6px; padding: 3px 8px;
    background: rgba(255,255,255,0.05); border-radius: 10px;
    font-size: 10px; color: var(--muted);
  }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .track {
    display: flex; align-items: center; gap: 14px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; transition: background 0.15s;
  }
  .track:hover { background: rgba(255,255,255,0.05); }
  .track.playing { background: rgba(29,185,84,0.08); }
  .track-num {
    width: 28px; text-align: center; color: var(--muted); font-size: 14px; flex-shrink: 0;
  }
  .track.playing .track-num { color: var(--accent); }
  .track img {
    width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
    background: #2a2a3a; flex-shrink: 0;
  }
  .track-info { flex: 1; min-width: 0; }
  .track-title {
    font-weight: 500; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track.playing .track-title { color: var(--accent); }
  .track-artist {
    color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-genre {
    padding: 3px 10px; background: rgba(255,255,255,0.05); border-radius: 10px;
    font-size: 11px; color: var(--muted); flex-shrink: 0;
  }
  .track-dur { color: var(--muted); font-size: 12px; width: 44px; text-align: right; flex-shrink: 0; }
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--border); padding: 12px 20px;
    display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 16px; align-items: center;
    backdrop-filter: blur(20px); z-index: 100;
  }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now img {
    width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
    background: #2a2a3a; flex-shrink: 0;
  }
  .now .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .btns { display: flex; gap: 10px; align-items: center; }
  .btns button { padding: 8px 14px; font-size: 14px; }
  .btns .big {
    width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 18px;
    background: white; color: #000;
  }
  .progress { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 12px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; }
  .vol { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .vol input { width: 100px; accent-color: var(--accent); }
  .loading {
    display: flex; flex-direction: column; align-items: center; padding: 60px 20px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .genre-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px; max-width: 700px; margin: 0 auto 30px;
  }
  .genre-card {
    padding: 16px 12px; border-radius: 12px; text-align: center; cursor: pointer;
    font-weight: 600; font-size: 14px; color: white; border: none;
    transition: transform 0.15s, filter 0.15s;
  }
  .genre-card:hover { transform: scale(1.04); filter: brightness(1.1); }
  @media (max-width: 700px) {
    .player { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
    .vol { justify-content: center; }
    .track-genre { display: none; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🎵 SoundFinder</h1>
  <p class="subtitle">Discover and play full songs — powered by Jamendo (Creative Commons)</p>

  <div class="controls">
    <input type="text" id="query" placeholder="Search songs, artists, albums..." autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="controls" id="keyRow">
    <input type="password" id="jamendoKey" placeholder="Jamendo client_id (free at devportal.jamendo.com)">
    <button class="ghost" id="saveKey">Save key</button>
  </div>

  <div class="quick-picks">
    <span>Try:</span>
    <button class="pill" data-q="rock">Rock</button>
    <button class="pill" data-q="pop">Pop</button>
    <button class="pill" data-q="electronic">Electronic</button>
    <button class="pill" data-q="jazz">Jazz</button>
    <button class="pill" data-q="hip hop">Hip Hop</button>
    <button class="pill" data-q="classical">Classical</button>
    <button class="pill" data-q="ambient">Ambient</button>
    <button class="pill" data-q="indie">Indie</button>
  </div>

  <div class="notice">
    🎶 Plays <strong>full songs</strong> under Creative Commons via <a href="https://www.jamendo.com" target="_blank">Jamendo</a>.
    Get a free API key at <a href="https://devportal.jamendo.com/signup" target="_blank">devportal.jamendo.com</a>.
  </div>
</header>

<div id="status"></div>
<div id="content">
  <div class="empty-state">
    <div class="icon">🎧</div>
    <p>Search for music or pick a genre to get started</p>
  </div>
  <div class="genre-grid" id="genreGrid"></div>
</div>

<div class="player" id="player" style="display:none">
  <div class="now">
    <img id="nowArt" src="" alt="">
    <div style="min-width:0">
      <div class="t" id="nowTitle">Nothing playing</div>
      <div class="a" id="nowArtist"></div>
    </div>
  </div>
  <div class="center">
    <div class="btns">
      <button id="prevBtn" class="ghost">⏮</button>
      <button id="playBtn" class="big">▶</button>
      <button id="nextBtn" class="ghost">⏭</button>
    </div>
    <div class="progress">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="dur">0:00</span>
    </div>
  </div>
  <div class="vol">
    🔊 <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');

  let jamendoKey = localStorage.getItem('jamendo_cid') || '';
  let tracks = [];
  let recommendations = [];
  let current = -1;
  let currentList = 'tracks'; // 'tracks' or 'recs'
  let lastQuery = '';

  // Genre cards for empty state
  const genres = [
    { name: 'Rock', color: 'linear-gradient(135deg, #e74c3c, #e67e22)' },
    { name: 'Pop', color: 'linear-gradient(135deg, #e91e63, #f44336)' },
    { name: 'Electronic', color: 'linear-gradient(135deg, #00bcd4, #2196f3)' },
    { name: 'Jazz', color: 'linear-gradient(135deg, #4caf50, #009688)' },
    { name: 'Hip Hop', color: 'linear-gradient(135deg, #9c27b0, #673ab7)' },
    { name: 'Classical', color: 'linear-gradient(135deg, #607d8b, #455a64)' },
    { name: 'Ambient', color: 'linear-gradient(135deg, #3f51b5, #1a237e)' },
    { name: 'Indie', color: 'linear-gradient(135deg, #ff9800, #f57c00)' },
    { name: 'Folk', color: 'linear-gradient(135deg, #8d6e63, #5d4037)' },
    { name: 'Metal', color: 'linear-gradient(135deg, #424242, #212121)' },
    { name: 'Reggae', color: 'linear-gradient(135deg, #fdd835, #43a047)' },
    { name: 'Blues', color: 'linear-gradient(135deg, #1565c0, #0d47a1)' },
  ];

  // Render genre grid
  $('genreGrid').innerHTML = genres.map(g =>
    `<button class="genre-card" style="background:${g.color}" data-q="${g.name}">${g.name}</button>`
  ).join('');

  document.querySelectorAll('.genre-card').forEach(el => {
    el.addEventListener('click', () => {
      $('query').value = el.dataset.q;
      doSearch();
    });
  });

  // Init key
  if (jamendoKey) {
    $('jamendoKey').value = jamendoKey;
  }

  // ---------- Helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const fmt = s => {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  };

  const setStatus = msg => $('status').textContent = msg;

  // ---------- API ----------
  async function searchJamendo(q) {
    if (!jamendoKey) throw new Error('⚠️ Enter your Jamendo client ID first (free at devportal.jamendo.com)');
    const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${encodeURIComponent(jamendoKey)}` +
      `&format=json&limit=50&include=musicinfo&audioformat=mp32&search=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Request failed. Check your client ID.');
    const data = await res.json();
    if (!data.results || data.results.length === 0) return [];
    return data.results.map(r => ({
      id: r.id,
      title: r.name,
      artist: r.artist_name,
      album: r.album_name || '',
      art: r.image || r.album_image || '',
      src: r.audio,
      duration: r.duration,
      genre: (r.musicinfo && r.musicinfo.tags && r.musicinfo.tags.genres && r.musicinfo.tags.genres[0]) || 'Unknown',
      link: r.shareurl
    }));
  }

  function getRecommendations(seedTracks, allTracks, count = 10) {
    if (seedTracks.length === 0) return [];
    const seedGenres = new Set(seedTracks.map(t => t.genre));
    const seedArtists = new Set(seedTracks.map(t => t.artist.toLowerCase()));
    const seedIds = new Set(seedTracks.map(t => t.id));
    const available = allTracks.filter(t => !seedIds.has(t.id));
    if (available.length === 0) {
      return [...seedTracks].sort(() => Math.random() - 0.5).slice(0, count);
    }
    const scored = available.map(track => {
      let score = 0;
      if (seedGenres.has(track.genre)) score += 3;
      if (seedArtists.has(track.artist.toLowerCase())) score += 5;
      score += Math.random() * 2;
      return { track, score };
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, Math.min(count, scored.length)).map(s => s.track);
  }

  // ---------- Search ----------
  async function doSearch() {
    const q = $('query').value.trim();
    if (!q) return;
    if (!jamendoKey) {
      setStatus('⚠️ Enter your Jamendo client ID first');
      $('jamendoKey').focus();
      return;
    }
    lastQuery = q;
    setStatus('Searching...');
    $('content').innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;color:var(--muted)">Finding songs...</p></div>';

    try {
      tracks = await searchJamendo(q);
      if (tracks.length === 0) {
        $('content').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No results found. Try a different search.</p></div>';
        setStatus('');
        recommendations = [];
        return;
      }
      const seeds = tracks.slice(0, Math.min(5, tracks.length));
      recommendations = getRecommendations(seeds, tracks, 10);
      renderAll();
      setStatus(`${tracks.length} songs found`);
    } catch (e) {
      $('content').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
      setStatus('');
      tracks = [];
      recommendations = [];
    }
  }

  function renderAll() {
    let html = '';

    // Recommendations
    if (recommendations.length > 0) {
      html += `
        <div class="section">
          <div class="section-head">
            <div class="section-icon" style="background:linear-gradient(135deg,var(--accent),#169c46)">✨</div>
            <div>
              <div class="section-title">Recommended For You</div>
              <div class="section-sub">Based on "${esc(lastQuery)}"</div>
            </div>
          </div>
          <div class="grid">
            ${recommendations.map((t, i) => `
              <div class="card ${currentList==='recs'&&current===i?'playing':''}" data-list="recs" data-i="${i}">
                <img src="${esc(t.art)}" alt="" loading="lazy">
                <div class="play-overlay">▶</div>
                <div class="title">${esc(t.title)}</div>
                <div class="artist">${esc(t.artist)}</div>
                <div class="genre-tag">${esc(t.genre)}</div>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    // All results
    html += `
      <div class="section">
        <div class="section-head">
          <div class="section-icon" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)">🔍</div>
          <div>
            <div class="section-title">All Results</div>
            <div class="section-sub">${tracks.length} songs for "${esc(lastQuery)}"</div>
          </div>
        </div>
        <div class="list">
          ${tracks.map((t, i) => `
            <div class="track ${currentList==='tracks'&&current===i?'playing':''}" data-list="tracks" data-i="${i}">
              <div class="track-num">${currentList==='tracks'&&current===i?'🔊':(i+1)}</div>
              <img src="${esc(t.art)}" alt="" loading="lazy">
              <div class="track-info">
                <div class="track-title">${esc(t.title)}</div>
                <div class="track-artist">${esc(t.artist)}</div>
              </div>
              <div class="track-genre">${esc(t.genre)}</div>
              <div class="track-dur">${fmt(t.duration)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;

    $('content').innerHTML = html;

    // Attach click handlers
    document.querySelectorAll('.card, .track').forEach(el => {
      el.addEventListener('click', () => {
        playFromList(el.dataset.list, +el.dataset.i);
      });
    });
  }

  // ---------- Playback ----------
  function getList(name) {
    return name === 'recs' ? recommendations : tracks;
  }

  function playFromList(listName, index) {
    const list = getList(listName);
    if (index < 0 || index >= list.length) return;
    currentList = listName;
    current = index;
    const t = list[index];
    audio.src = t.src;
    audio.play().catch(() => setStatus('Playback failed for this track.'));
    $('nowTitle').textContent = t.title;
    $('nowArtist').textContent = t.artist + (t.album ? ' · ' + t.album : '');
    $('nowArt').src = t.art;
    $('player').style.display = 'grid';
    renderAll();
  }

  const togglePlay = () => {
    if (current < 0 && tracks.length) return playFromList('tracks', 0);
    audio.paused ? audio.play() : audio.pause();
  };

  $('playBtn').onclick = togglePlay;
  $('nextBtn').onclick = () => {
    const list = getList(currentList);
    if (list.length === 0) return;
    playFromList(currentList, (current + 1) % list.length);
  };
  $('prevBtn').onclick = () => {
    const list = getList(currentList);
    if (list.length === 0) return;
    playFromList(currentList, current <= 0 ? list.length - 1 : current - 1);
  };

  audio.addEventListener('play', () => $('playBtn').textContent = '⏸');
  audio.addEventListener('pause', () => $('playBtn').textContent = '▶');
  audio.addEventListener('ended', () => $('nextBtn').click());
  audio.addEventListener('loadedmetadata', () => {
    $('dur').textContent = fmt(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    $('cur').textContent = fmt(audio.currentTime);
    if (audio.duration) $('seek').value = (audio.currentTime / audio.duration) * 100;
  });
  audio.addEventListener('error', () => {
    setStatus('⚠️ Audio failed to load. Trying next track...');
    setTimeout(() => $('nextBtn').click(), 1500);
  });

  $('seek').addEventListener('input', e => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });
  $('vol').addEventListener('input', e => audio.volume = e.target.value);
  audio.volume = 0.8;

  // ---------- Key Management ----------
  $('saveKey').onclick = () => {
    jamendoKey = $('jamendoKey').value.trim();
    if (jamendoKey) {
      localStorage.setItem('jamendo_cid', jamendoKey);
      setStatus('✅ Key saved! You can now search.');
    } else {
      setStatus('Enter a valid key.');
    }
  };

  // ---------- Events ----------
  $('searchBtn').onclick = doSearch;
  $('query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  document.querySelectorAll('.pill').forEach(el => {
    el.addEventListener('click', () => {
      $('query').value = el.dataset.q;
      doSearch();
    });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight' && e.shiftKey) $('nextBtn').click();
    if (e.code === 'ArrowLeft' && e.shiftKey) $('prevBtn').click();
  });
})();
</script>
</body>
</html>
